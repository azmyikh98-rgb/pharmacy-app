<!--
  table.html
  -----------------------------------------------------------------------
  Referensi pola "Reusable Table" memakai factory dataTable() dari
  js/ui-components.js. Fragment ini berisi CONTOH dengan data dummy untuk
  keperluan showcase Design System (Tahap 2).

  Mulai Tahap 5 (Master Data) dst, setiap modul TIDAK meng-include fragment
  ini apa adanya — melainkan menyalin pola x-data="dataTable({...})" di
  bawah ini ke halaman masing-masing dengan columns & rows sesuai modulnya,
  lalu mengisi `rows` lewat Api.get(...) alih-alih data dummy.
-->
<div
  x-data="dataTable({
    columns: [
      { key: 'code', label: 'Kode' },
      { key: 'name', label: 'Nama Obat' },
      { key: 'category', label: 'Kategori' },
      { key: 'stock', label: 'Stok', align: 'right' },
      { key: 'price', label: 'Harga Jual', align: 'right' },
      { key: 'status', label: 'Status' },
    ],
    rows: [
      { code: 'OBT-001', name: 'Paracetamol 500mg', category: 'Analgesik', stock: 240, price: 'Rp 2.000', status: 'Aktif' },
      { code: 'OBT-002', name: 'Amoxicillin 500mg', category: 'Antibiotik', stock: 12, price: 'Rp 5.500', status: 'Stok Menipis' },
      { code: 'OBT-003', name: 'Vitamin C 1000mg', category: 'Vitamin', stock: 0, price: 'Rp 8.000', status: 'Habis' },
    ],
  })"
  class="app-card overflow-hidden"
>
  <div class="overflow-x-auto">
    <table class="min-w-full whitespace-nowrap text-left text-sm">
      <thead class="border-b border-slate-100 bg-slate-50/60 text-xs font-medium uppercase tracking-wide text-slate-500">
        <tr>
          <template x-for="col in columns" :key="col.key">
            <th class="px-4 py-3" :class="col.align === 'right' && 'text-right'" x-text="col.label"></th>
          </template>
        </tr>
      </thead>
      <tbody class="divide-y divide-slate-100">
        <!-- Skeleton loading state -->
        <template x-if="loading">
          <template x-for="i in 3" :key="i">
            <tr>
              <template x-for="col in columns" :key="col.key">
                <td class="px-4 py-3">
                  <div class="skeleton-line"></div>
                </td>
              </template>
            </tr>
          </template>
        </template>

        <!-- Data state -->
        <template x-if="!loading">
          <template x-for="row in rows" :key="row.code">
            <tr class="hover:bg-slate-50/70">
              <template x-for="col in columns" :key="col.key">
                <td class="px-4 py-3 text-slate-700" :class="col.align === 'right' && 'text-right'" x-text="cellValue(row, col.key)"></td>
              </template>
            </tr>
          </template>
        </template>

        <!-- Empty state -->
        <template x-if="!loading && rows.length === 0">
          <tr><td class="px-4 py-8 text-center text-slate-400" :colspan="columns.length">Tidak ada data</td></tr>
        </template>
      </tbody>
    </table>
  </div>
</div>
