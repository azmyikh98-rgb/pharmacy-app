<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>POS Kasir — Modern Pharmacy Management System</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../js/tailwind.config.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/pos.css" />

  <script src="../js/config.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/toast.js"></script>
  <script src="../js/modal.js"></script>
  <script src="../js/ui-components.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/pos.js"></script>
</head>
<body class="min-h-screen bg-surface font-sans text-slate-800 antialiased">
  <script>Auth.requireAuth();</script>

  <div x-data class="flex h-screen overflow-hidden">
    <aside class="hidden lg:block" data-include="../components/sidebar.html"></aside>
    <div x-show="$store.layout.sidebarOpen" x-transition.opacity class="fixed inset-0 z-40 bg-slate-900/50 lg:hidden" style="display:none;" @click="$store.layout.closeSidebar()"></div>
    <div x-show="$store.layout.sidebarOpen" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="-translate-x-full" x-transition:enter-end="translate-x-0" x-transition:leave="transition ease-in duration-150" x-transition:leave-start="translate-x-0" x-transition:leave-end="-translate-x-full" class="fixed inset-y-0 left-0 z-50 lg:hidden" style="display:none;" data-include="../components/sidebar.html"></div>

    <div class="flex flex-1 flex-col overflow-hidden">
      <div data-include="../components/navbar.html"></div>

      <main class="flex-1 overflow-y-auto p-4 sm:p-6" x-data="posPage()" x-init="init()">
        <div class="mx-auto max-w-6xl space-y-4">

          <div>
            <h1 class="text-xl font-semibold text-slate-900">Kasir</h1>
            <p class="mt-1 text-sm text-slate-500">Pilih produk, atur keranjang, lalu proses pembayaran</p>
          </div>

          <!-- Search -->
          <div class="relative">
            <svg class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z"/></svg>
            <input
              type="text"
              class="input-field pl-9"
              placeholder="Cari produk atau scan barcode... (Enter untuk tambah)"
              x-model="search"
              @keydown.enter="onSearchEnter()"
              autofocus
            />
          </div>

          <!-- Filter kategori -->
          <div class="flex flex-wrap gap-2">
            <template x-for="cat in categories" :key="cat">
              <button
                type="button"
                class="rounded-full px-4 py-1.5 text-sm font-medium transition-colors"
                :class="selectedCategory === cat ? 'bg-primary-600 text-white' : 'bg-white text-slate-600 ring-1 ring-slate-200 hover:bg-slate-50'"
                @click="selectedCategory = cat"
                x-text="cat"
              ></button>
            </template>
          </div>

          <!-- Ringkasan keranjang (collapsible) -->
          <div class="app-card overflow-hidden">
            <button type="button" class="flex w-full items-center justify-between gap-3 p-4" @click="cartExpanded = !cartExpanded">
              <div class="flex items-center gap-3">
                <div class="flex h-9 w-9 items-center justify-center rounded-full bg-primary-50 text-primary-600">
                  <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 3h1.386c.51 0 .955.343 1.087.835l.383 1.437M7.5 14.25a3 3 0 0 0-3 3h15.75m-12.75-3h11.218c1.121-2.3 1.94-4.723 2.436-7.234a1.125 1.125 0 0 0-1.1-1.362H5.25M7.5 14.25 5.106 5.272M6.75 14.25 4.106 5.272"/></svg>
                </div>
                <span class="text-sm font-semibold text-slate-800">Pelanggan <span x-text="customerName"></span></span>
                <span class="badge badge-neutral" x-text="totalQty + ' item'"></span>
              </div>
              <div class="flex items-center gap-3">
                <span class="text-base font-semibold text-slate-900" x-text="formatRupiah(total)"></span>
                <svg class="h-4 w-4 text-slate-400 transition-transform" :class="cartExpanded && 'rotate-180'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5"/></svg>
              </div>
            </button>

            <div x-show="cartExpanded" x-transition class="border-t border-slate-100 p-4" style="display: none;">
              <div class="pos-cart-list space-y-2">
                <template x-for="item in cart" :key="item.medicine_id">
                  <div class="flex items-center gap-2 rounded-lg border border-slate-100 p-2">
                    <div class="flex-1">
                      <p class="text-sm font-medium text-slate-800" x-text="item.medicine_name"></p>
                      <p class="text-xs text-slate-400" x-text="formatRupiah(item.price) + ' / item'"></p>
                    </div>
                    <button type="button" class="btn btn-ghost h-7 w-7 p-0" @click="decrementQty(item)">−</button>
                    <span class="w-6 text-center text-sm" x-text="item.qty"></span>
                    <button type="button" class="btn btn-ghost h-7 w-7 p-0" @click="incrementQty(item)">+</button>
                    <span class="w-20 text-right text-sm font-medium text-slate-700" x-text="formatRupiah(itemSubtotal(item))"></span>
                  </div>
                </template>

                <template x-if="cart.length === 0">
                  <p class="py-6 text-center text-sm text-slate-400">Keranjang masih kosong</p>
                </template>
              </div>

              <!-- Member -->
              <div class="mt-3">
                <label class="input-label">Member (opsional)</label>
                <select class="input-field" x-model="customerId" @change="onCustomerChange()">
                  <option value="">Umum (tanpa member)</option>
                  <template x-for="c in customers" :key="c.id"><option :value="c.id" x-text="c.name + ' (poin: ' + (c.member_point || 0) + ')'"></option></template>
                </select>
              </div>

              <!-- Diskon / Voucher / Pajak -->
              <div class="mt-3 grid grid-cols-3 gap-2">
                <div>
                  <label class="input-label">Diskon (Rp)</label>
                  <input type="number" min="0" class="input-field" x-model="discount" placeholder="0" />
                </div>
                <div>
                  <label class="input-label">Voucher (Rp)</label>
                  <input type="number" min="0" class="input-field" x-model="voucher" placeholder="0" />
                </div>
                <div>
                  <label class="input-label">Pajak (%)</label>
                  <input type="number" min="0" class="input-field" x-model="taxPercent" placeholder="0" />
                </div>
              </div>

              <!-- Ringkasan total -->
              <div class="mt-3 space-y-1 rounded-lg bg-slate-50 p-3 text-sm">
                <div class="flex justify-between"><span class="text-slate-500">Subtotal</span><span x-text="formatRupiah(subtotal)"></span></div>
                <div class="flex justify-between"><span class="text-slate-500">Diskon + Voucher</span><span>- <span x-text="formatRupiah(Number(discount) + Number(voucher))"></span></span></div>
                <div class="flex justify-between"><span class="text-slate-500">Pajak</span><span x-text="formatRupiah(taxAmount)"></span></div>
                <div class="flex justify-between border-t border-slate-200 pt-1 text-base font-semibold text-slate-900"><span>Total</span><span x-text="formatRupiah(total)"></span></div>
              </div>

              <!-- Pembayaran -->
              <div class="mt-3 grid grid-cols-2 gap-2">
                <div>
                  <label class="input-label">Metode Bayar</label>
                  <select class="input-field" x-model="paymentMethod">
                    <option value="cash">Cash</option>
                    <option value="qris">QRIS</option>
                    <option value="transfer">Transfer</option>
                    <option value="debit">Debit</option>
                    <option value="credit">Credit Card</option>
                  </select>
                </div>
                <div>
                  <label class="input-label">Jumlah Bayar</label>
                  <input type="number" min="0" class="input-field" x-model="paidAmount" placeholder="Contoh: 50000" />
                </div>
              </div>
              <p class="mt-1 text-right text-xs text-slate-500">Kembalian: <span class="font-medium" x-text="formatRupiah(changeAmount)"></span></p>

              <div x-show="checkoutError" x-transition class="mt-2 rounded-lg bg-danger-50 px-3 py-2 text-sm text-danger-700" x-text="checkoutError" style="display:none;"></div>

              <button type="button" class="btn btn-primary mt-3 w-full" :disabled="processing" @click="checkout()">
                <span x-show="!processing">Bayar &amp; Simpan Transaksi</span>
                <span x-show="processing">Memproses...</span>
              </button>
            </div>
          </div>

          <!-- Grid produk -->
          <div class="grid grid-cols-3 gap-2 sm:grid-cols-4 lg:grid-cols-6 xl:grid-cols-8">
            <template x-for="m in filteredMedicines" :key="m.id">
              <div
                class="app-card relative cursor-pointer p-2 hover:ring-2 hover:ring-primary-100"
                :class="Number(m.stock) <= 0 && 'opacity-50'"
                @click="addToCart(m)"
              >
                <button
                  type="button"
                  class="absolute right-1.5 top-1.5 z-10 text-slate-300 hover:text-warning-600"
                  :class="isFavorite(m.id) && 'text-warning-600'"
                  @click.stop="toggleFavorite(m.id)"
                  title="Tandai favorit"
                >
                  <svg class="h-4 w-4" :fill="isFavorite(m.id) ? 'currentColor' : 'none'" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="m11.48 3.499 2.19 4.435 4.898.712-3.545 3.455.837 4.878L11.48 14.9l-4.38 2.303.837-4.878L4.392 8.87l4.898-.712 2.19-4.435Z"/></svg>
                </button>

                <div class="mb-1.5 flex h-16 items-center justify-center overflow-hidden rounded-md bg-primary-50">
                  <img x-show="m.photo_url" :src="m.photo_url" class="h-full w-full object-cover" />
                  <svg x-show="!m.photo_url" class="h-6 w-6 text-primary-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="m21 7.5-9-5.25L3 7.5m18 0-9 5.25m9-5.25v9l-9 5.25M3 7.5l9 5.25M3 7.5v9l9 5.25m0-9v9"/></svg>
                </div>

                <p class="truncate text-xs font-semibold text-slate-800" x-text="m.name"></p>
                <p class="truncate text-[11px] text-slate-400" x-text="m.category || '-'"></p>
                <p class="mt-0.5 text-xs font-semibold text-primary-600" x-text="formatRupiah(m.sell_price)"></p>
                <p class="text-[11px] text-slate-400" x-text="'Stok: ' + m.stock"></p>
              </div>
            </template>

            <template x-if="filteredMedicines.length === 0">
              <p class="col-span-full py-8 text-center text-sm text-slate-400">Obat tidak ditemukan</p>
            </template>
          </div>
        </div>

        <!-- Modal Struk -->
        <div x-show="showReceipt" x-transition.opacity class="modal-backdrop" style="display: none;">
          <div class="modal-panel max-w-sm">
            <div id="receipt" class="text-sm">
              <div class="text-center">
                <p class="font-semibold" x-text="window.APP_CONFIG.APP_NAME"></p>
                <p class="text-xs text-slate-500" x-text="lastReceipt?.invoice_number"></p>
              </div>
              <hr class="my-2 border-dashed border-slate-300" />
              <template x-for="item in lastReceipt?.items || []" :key="item.medicine_id">
                <div class="receipt-item">
                  <span x-text="item.medicine_name + ' x' + item.qty"></span>
                  <span x-text="formatRupiah(item.qty * item.price)"></span>
                </div>
              </template>
              <hr class="my-2 border-dashed border-slate-300" />
              <div class="receipt-item"><span>Subtotal</span><span x-text="formatRupiah(lastReceipt?.subtotal)"></span></div>
              <div class="receipt-item"><span>Diskon+Voucher</span><span x-text="formatRupiah((lastReceipt?.discount || 0) + (lastReceipt?.voucher || 0))"></span></div>
              <div class="receipt-item"><span>Pajak</span><span x-text="formatRupiah(lastReceipt?.tax)"></span></div>
              <div class="receipt-item font-semibold"><span>Total</span><span x-text="formatRupiah(lastReceipt?.total)"></span></div>
              <div class="receipt-item"><span>Bayar (<span x-text="lastReceipt?.payment_method"></span>)</span><span x-text="formatRupiah(lastReceipt?.paid_amount)"></span></div>
              <div class="receipt-item"><span>Kembali</span><span x-text="formatRupiah(lastReceipt?.change_amount)"></span></div>
              <p class="mt-2 text-center text-xs text-slate-400">Terima kasih atas kunjungan Anda</p>
            </div>

            <div class="mt-4 flex justify-end gap-2">
              <button type="button" class="btn btn-ghost" @click="closeReceipt()">Tutup</button>
              <button type="button" class="btn btn-primary" @click="printReceipt()">Cetak Struk</button>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <div data-include="../components/toast.html"></div>
  <div data-include="../components/modal.html"></div>
</body>
</html>
