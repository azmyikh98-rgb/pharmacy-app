<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Obat — Modern Pharmacy Management System</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../js/tailwind.config.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/medicine.css" />

  <script src="../js/config.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/toast.js"></script>
  <script src="../js/modal.js"></script>
  <script src="../js/ui-components.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/crud-page.js"></script>
  <script src="../js/medicine.js"></script>
</head>
<body class="min-h-screen bg-surface font-sans text-slate-800 antialiased">
  <script>Auth.requireAuth();</script>

  <div x-data class="flex h-screen overflow-hidden">
    <aside class="hidden lg:block" data-include="../components/sidebar.html"></aside>
    <div x-show="$store.layout.sidebarOpen" x-transition.opacity class="fixed inset-0 z-40 bg-slate-900/50 lg:hidden" style="display:none;" @click="$store.layout.closeSidebar()"></div>
    <div x-show="$store.layout.sidebarOpen" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="-translate-x-full" x-transition:enter-end="translate-x-0" x-transition:leave="transition ease-in duration-150" x-transition:leave-start="translate-x-0" x-transition:leave-end="-translate-x-full" class="fixed inset-y-0 left-0 z-50 lg:hidden" style="display:none;" data-include="../components/sidebar.html"></div>

    <div class="flex flex-1 flex-col overflow-hidden">
      <div data-include="../components/navbar.html"></div>

      <main class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8" x-data="medicinePage()" x-init="init()">
        <div class="mx-auto max-w-6xl space-y-6">
          <div>
            <h1 class="text-xl font-semibold text-slate-900">Master Data — Obat</h1>
            <p class="mt-1 text-sm text-slate-500">Kelola data obat: harga, stok, batch, dan tanggal expired.</p>
          </div>

          <div data-include="../components/crud-table.html"></div>
        </div>

        <!-- Modal Form -->
        <div x-show="showModal" x-transition.opacity class="modal-backdrop items-start overflow-y-auto py-8" style="display: none;" @keydown.escape.window="closeModal()">
          <div class="modal-panel max-w-2xl" @click.outside="closeModal()">
            <h3 class="text-base font-semibold text-slate-900" x-text="isEdit ? 'Edit Obat' : 'Tambah Obat'"></h3>

            <div x-show="formError" x-transition class="mt-3 rounded-lg bg-danger-50 px-3 py-2 text-sm text-danger-700" x-text="formError" style="display:none;"></div>

            <form @submit.prevent="submitForm()" id="medicine-form-sections" class="mt-4 space-y-4">
              <!-- Identitas -->
              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label class="input-label">Kode Obat <span class="text-danger-600">*</span></label>
                  <input type="text" class="input-field" x-model="form.code" required />
                </div>
                <div>
                  <label class="input-label">Barcode</label>
                  <input type="text" class="input-field" x-model="form.barcode" />
                </div>
              </div>
              <div>
                <label class="input-label">Nama Obat <span class="text-danger-600">*</span></label>
                <input type="text" class="input-field" x-model="form.name" required />
              </div>

              <!-- Kategori / Golongan / Merk / Satuan -->
              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label class="input-label">Kategori</label>
                  <select class="input-field" x-model="form.category">
                    <option value="">- Pilih -</option>
                    <template x-for="c in lookups.categories" :key="c.id"><option :value="c.name" x-text="c.name"></option></template>
                  </select>
                </div>
                <div>
                  <label class="input-label">Golongan</label>
                  <select class="input-field" x-model="form.golongan">
                    <option value="">- Pilih -</option>
                    <option value="bebas">Bebas</option>
                    <option value="bebas_terbatas">Bebas Terbatas</option>
                    <option value="keras">Keras</option>
                    <option value="narkotika">Narkotika</option>
                  </select>
                </div>
              </div>
              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label class="input-label">Merk</label>
                  <select class="input-field" x-model="form.brand">
                    <option value="">- Pilih -</option>
                    <template x-for="b in lookups.brands" :key="b.id"><option :value="b.name" x-text="b.name"></option></template>
                  </select>
                </div>
                <div>
                  <label class="input-label">Satuan</label>
                  <select class="input-field" x-model="form.unit">
                    <option value="">- Pilih -</option>
                    <template x-for="u in lookups.units" :key="u.id"><option :value="u.name" x-text="u.name"></option></template>
                  </select>
                </div>
              </div>

              <!-- Harga & Margin -->
              <div class="grid grid-cols-3 gap-3">
                <div>
                  <label class="input-label">Harga Beli</label>
                  <input type="number" min="0" class="input-field" x-model="form.buy_price" />
                </div>
                <div>
                  <label class="input-label">Harga Jual</label>
                  <input type="number" min="0" class="input-field" x-model="form.sell_price" />
                </div>
                <div>
                  <label class="input-label">Margin</label>
                  <input type="text" class="input-field bg-slate-50" :value="marginPercent()" disabled />
                </div>
              </div>

              <!-- Stok -->
              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label class="input-label">Stok</label>
                  <input type="number" min="0" class="input-field" x-model="form.stock" />
                </div>
                <div>
                  <label class="input-label">Minimum Stock</label>
                  <input type="number" min="0" class="input-field" x-model="form.min_stock" />
                </div>
              </div>

              <!-- Batch & Expired -->
              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label class="input-label">Batch</label>
                  <input type="text" class="input-field" x-model="form.batch" />
                </div>
                <div>
                  <label class="input-label">Expired Date</label>
                  <input type="date" class="input-field" x-model="form.expired_date" />
                </div>
              </div>

              <!-- Lokasi & Supplier -->
              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label class="input-label">Lokasi Rak</label>
                  <input type="text" class="input-field" x-model="form.rack_location" />
                </div>
                <div>
                  <label class="input-label">Supplier</label>
                  <select class="input-field" x-model="form.supplier">
                    <option value="">- Pilih -</option>
                    <template x-for="s in lookups.suppliers" :key="s.id"><option :value="s.name" x-text="s.name"></option></template>
                  </select>
                </div>
              </div>

              <div>
                <label class="input-label">Foto (URL Gambar)</label>
                <input type="text" class="input-field" x-model="form.photo_url" placeholder="https://..." />
              </div>
              <div>
                <label class="input-label">Keterangan</label>
                <textarea class="input-field" rows="2" x-model="form.notes"></textarea>
              </div>
              <div>
                <label class="input-label">Status</label>
                <select class="input-field" x-model="form.status">
                  <option value="active">Aktif</option>
                  <option value="inactive">Nonaktif</option>
                </select>
              </div>

              <div class="mt-5 flex justify-end gap-2">
                <button type="button" class="btn btn-ghost" @click="closeModal()">Batal</button>
                <button type="submit" class="btn btn-primary" :disabled="saving">
                  <span x-show="!saving">Simpan</span>
                  <span x-show="saving">Menyimpan...</span>
                </button>
              </div>
            </form>
          </div>
        </div>
      </main>
    </div>
  </div>

  <div data-include="../components/toast.html"></div>
  <div data-include="../components/modal.html"></div>
</body>
</html>
