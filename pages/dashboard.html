<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — Modern Pharmacy Management System</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../js/tailwind.config.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/dashboard.css" />

  <script src="../js/config.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/toast.js"></script>
  <script src="../js/modal.js"></script>
  <script src="../js/ui-components.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/dashboard.js"></script>
</head>
<body class="min-h-screen bg-surface font-sans text-slate-800 antialiased">

  <!-- Route guard -->
  <script>
    Auth.requireAuth();
  </script>

  <div x-data class="flex h-screen overflow-hidden">
    <aside class="hidden lg:block" data-include="../components/sidebar.html"></aside>
    <div
      x-show="$store.layout.sidebarOpen"
      x-transition.opacity
      class="fixed inset-0 z-40 bg-slate-900/50 lg:hidden"
      style="display: none;"
      @click="$store.layout.closeSidebar()"
    ></div>
    <div
      x-show="$store.layout.sidebarOpen"
      x-transition:enter="transition ease-out duration-200"
      x-transition:enter-start="-translate-x-full"
      x-transition:enter-end="translate-x-0"
      x-transition:leave="transition ease-in duration-150"
      x-transition:leave-start="translate-x-0"
      x-transition:leave-end="-translate-x-full"
      class="fixed inset-y-0 left-0 z-50 lg:hidden"
      style="display: none;"
      data-include="../components/sidebar.html"
    ></div>

    <div class="flex flex-1 flex-col overflow-hidden">
      <div data-include="../components/navbar.html"></div>

      <main class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8" x-data="dashboardPage()" x-init="init()">
        <div class="mx-auto max-w-7xl space-y-6">

          <div>
            <h1 class="text-xl font-semibold text-slate-900">
              Halo, <span x-text="user?.name || 'Pengguna'"></span> 👋
            </h1>
            <p class="mt-1 text-sm text-slate-500">Ringkasan aktivitas apotek hari ini.</p>
          </div>

          <!-- Summary Cards -->
          <div class="grid grid-cols-2 gap-4 md:grid-cols-4">
            <template x-if="loading">
              <template x-for="i in 8" :key="i">
                <div class="app-card p-4"><div class="skeleton-line w-2/3"></div><div class="skeleton-block mt-3 h-6 w-1/2"></div></div>
              </template>
            </template>

            <template x-if="!loading">
              <div class="app-card p-4">
                <p class="text-xs font-medium text-slate-500">Total Obat</p>
                <p class="mt-1 text-xl font-semibold text-slate-900" x-text="summary.totalObat"></p>
              </div>
            </template>
            <template x-if="!loading">
              <div class="app-card p-4">
                <p class="text-xs font-medium text-slate-500">Obat Hampir Habis</p>
                <p class="mt-1 text-xl font-semibold text-warning-600" x-text="summary.obatHampirHabis"></p>
              </div>
            </template>
            <template x-if="!loading">
              <div class="app-card p-4">
                <p class="text-xs font-medium text-slate-500">Obat Expired</p>
                <p class="mt-1 text-xl font-semibold text-danger-600" x-text="summary.obatExpired"></p>
              </div>
            </template>
            <template x-if="!loading">
              <div class="app-card p-4">
                <p class="text-xs font-medium text-slate-500">Penjualan Hari Ini</p>
                <p class="mt-1 text-xl font-semibold text-slate-900" x-text="summary.penjualanHariIni"></p>
              </div>
            </template>
            <template x-if="!loading">
              <div class="app-card p-4">
                <p class="text-xs font-medium text-slate-500">Pendapatan Hari Ini</p>
                <p class="mt-1 text-xl font-semibold text-success-600" x-text="formatRupiah(summary.pendapatanHariIni)"></p>
              </div>
            </template>
            <template x-if="!loading">
              <div class="app-card p-4">
                <p class="text-xs font-medium text-slate-500">Pembelian Hari Ini</p>
                <p class="mt-1 text-xl font-semibold text-slate-900" x-text="formatRupiah(summary.pembelianHariIni)"></p>
              </div>
            </template>
            <template x-if="!loading">
              <div class="app-card p-4">
                <p class="text-xs font-medium text-slate-500">Supplier</p>
                <p class="mt-1 text-xl font-semibold text-slate-900" x-text="summary.totalSupplier"></p>
              </div>
            </template>
            <template x-if="!loading">
              <div class="app-card p-4">
                <p class="text-xs font-medium text-slate-500">Customer</p>
                <p class="mt-1 text-xl font-semibold text-slate-900" x-text="summary.totalCustomer"></p>
              </div>
            </template>
          </div>

          <!-- Charts -->
          <div class="grid grid-cols-1 gap-4 lg:grid-cols-2">
            <div class="app-card p-5">
              <h2 class="mb-3 text-sm font-semibold text-slate-700">Penjualan Bulanan</h2>
              <div class="chart-card"><canvas x-ref="salesChart"></canvas></div>
            </div>
            <div class="app-card p-5">
              <h2 class="mb-3 text-sm font-semibold text-slate-700">Pembelian Bulanan</h2>
              <div class="chart-card"><canvas x-ref="purchaseChart"></canvas></div>
            </div>
            <div class="app-card p-5">
              <h2 class="mb-3 text-sm font-semibold text-slate-700">Produk Terlaris</h2>
              <div class="chart-card"><canvas x-ref="topProductsChart"></canvas></div>
            </div>
            <div class="app-card p-5">
              <h2 class="mb-3 text-sm font-semibold text-slate-700">Kategori Terlaris</h2>
              <div class="chart-card"><canvas x-ref="topCategoriesChart"></canvas></div>
            </div>
          </div>

          <!-- Expired & Low Stock -->
          <div class="grid grid-cols-1 gap-4 lg:grid-cols-2">
            <div class="app-card p-5">
              <h2 class="mb-3 text-sm font-semibold text-slate-700">Obat Mendekati Expired (≤30 hari)</h2>
              <template x-if="!loading && nearExpiry.length === 0">
                <p class="text-sm text-slate-400">Tidak ada obat mendekati expired.</p>
              </template>
              <template x-for="item in nearExpiry" :key="item.name + item.expiredDate">
                <div class="activity-item">
                  <span class="badge badge-danger" x-text="item.daysLeft + ' hari'"></span>
                  <span class="flex-1 text-sm text-slate-700" x-text="item.name"></span>
                  <span class="text-xs text-slate-400" x-text="formatDate(item.expiredDate)"></span>
                </div>
              </template>
            </div>

            <div class="app-card p-5">
              <h2 class="mb-3 text-sm font-semibold text-slate-700">Stok di Bawah Minimum</h2>
              <template x-if="!loading && lowStock.length === 0">
                <p class="text-sm text-slate-400">Semua stok obat aman.</p>
              </template>
              <template x-for="item in lowStock" :key="item.name">
                <div class="activity-item">
                  <span class="badge badge-warning" x-text="item.stock + ' / ' + item.minStock"></span>
                  <span class="flex-1 text-sm text-slate-700" x-text="item.name"></span>
                </div>
              </template>
            </div>
          </div>

          <!-- Recent Activity -->
          <div class="app-card p-5">
            <h2 class="mb-3 text-sm font-semibold text-slate-700">Aktivitas Terbaru</h2>
            <template x-if="!loading && recentActivity.length === 0">
              <p class="text-sm text-slate-400">Belum ada aktivitas transaksi.</p>
            </template>
            <template x-for="activity in recentActivity" :key="activity.summary + activity.date">
              <div class="activity-item">
                <span
                  class="badge"
                  :class="activity.type === 'sales' ? 'badge-success' : 'badge-neutral'"
                  x-text="activity.type === 'sales' ? 'Penjualan' : 'Pembelian'"
                ></span>
                <span class="flex-1 text-sm text-slate-700" x-text="activity.summary"></span>
                <span class="text-xs text-slate-400" x-text="formatDate(activity.date)"></span>
              </div>
            </template>
          </div>

        </div>
      </main>
    </div>
  </div>

  <!-- Floating Action Button: Buka POS Kasir -->
  <a
    href="pos.html"
    class="fixed bottom-6 right-6 z-40 flex h-14 w-14 items-center justify-center rounded-full bg-primary-600 text-white shadow-soft-lg transition-transform hover:scale-105 hover:bg-primary-700"
    title="Buka POS Kasir"
    aria-label="Buka POS Kasir"
  >
    <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 3h1.386c.51 0 .955.343 1.087.835l.383 1.437M7.5 14.25a3 3 0 0 0-3 3h15.75m-12.75-3h11.218c1.121-2.3 1.94-4.723 2.436-7.234a1.125 1.125 0 0 0-1.1-1.362H5.25M7.5 14.25 5.106 5.272M6.75 14.25 4.106 5.272"/></svg>
  </a>

  <div data-include="../components/toast.html"></div>
  <div data-include="../components/modal.html"></div>
</body>
</html>
