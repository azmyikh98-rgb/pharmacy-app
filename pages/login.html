<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Modern Pharmacy Management System</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../js/tailwind.config.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />

  <script src="../js/config.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/login.js"></script>
</head>
<body class="min-h-screen bg-surface font-sans text-slate-800 antialiased">

  <!--
    Jika user yang sudah login membuka /pages/login.html lagi (mis. lewat
    bookmark lama), langsung arahkan ke dashboard alih-alih menampilkan
    form login sekali lagi.
  -->
  <script>
    if (Auth.isLoggedIn()) window.location.href = "dashboard.html";
  </script>

  <div class="flex min-h-screen items-center justify-center p-6">
    <div x-data="loginForm()" class="w-full max-w-sm">
      <form @submit.prevent="submit()" class="app-card space-y-4 p-6">
        <div class="mb-2 text-center">
          <div class="mx-auto mb-3 flex h-12 w-12 items-center justify-center rounded-xl bg-primary-600 text-lg font-semibold text-white">
            RX
          </div>
          <h1 class="text-lg font-semibold text-slate-900" x-text="appName"></h1>
          <p class="text-sm text-slate-500">Masuk untuk melanjutkan</p>
        </div>

        <div
          x-show="errorMessage"
          x-transition
          class="rounded-lg bg-danger-50 px-3 py-2 text-sm text-danger-700"
          x-text="errorMessage"
          style="display: none;"
        ></div>

        <div>
          <label class="input-label">Username</label>
          <input
            type="text"
            class="input-field"
            x-model="username"
            :disabled="loading"
            autocomplete="username"
            placeholder="Masukkan username"
            required
          />
        </div>

        <div>
          <label class="input-label">Password</label>
          <div class="relative">
            <input
              :type="showPassword ? 'text' : 'password'"
              class="input-field pr-10"
              x-model="password"
              :disabled="loading"
              autocomplete="current-password"
              placeholder="Masukkan password"
              required
            />
            <button
              type="button"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600"
              @click="showPassword = !showPassword"
              :aria-label="showPassword ? 'Sembunyikan password' : 'Tampilkan password'"
              tabindex="-1"
            >
              <!-- Mata default: tampil saat password disembunyikan -->
              <svg x-show="!showPassword" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/></svg>
              <!-- Mata coret: tampil saat password ditampilkan -->
              <svg x-show="showPassword" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="display: none;"><path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88"/></svg>
            </button>
          </div>
        </div>

        <label class="flex items-center gap-2 text-sm text-slate-600">
          <input type="checkbox" x-model="remember" class="h-4 w-4 rounded border-slate-300 text-primary-600" />
          Ingat saya
        </label>

        <button type="submit" class="btn btn-primary w-full" :disabled="loading">
          <span x-show="!loading">Masuk</span>
          <span x-show="loading">Memproses...</span>
        </button>
      </form>

      <p class="mt-4 text-center text-xs text-slate-400">
        Versi <span x-text="version"></span>
      </p>
    </div>
  </div>
</body>
</html>
