<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kategori / Satuan / Merk — Modern Pharmacy Management System</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../js/tailwind.config.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />

  <script src="../js/config.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/toast.js"></script>
  <script src="../js/modal.js"></script>
  <script src="../js/ui-components.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/crud-page.js"></script>
  <script src="../js/master-lookup.js"></script>
</head>
<body class="min-h-screen bg-surface font-sans text-slate-800 antialiased">
  <script>Auth.requireAuth();</script>

  <div x-data class="flex h-screen overflow-hidden">
    <aside class="hidden lg:block" data-include="../components/sidebar.html"></aside>
    <div x-show="$store.layout.sidebarOpen" x-transition.opacity class="fixed inset-0 z-40 bg-slate-900/50 lg:hidden" style="display:none;" @click="$store.layout.closeSidebar()"></div>
    <div x-show="$store.layout.sidebarOpen" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="-translate-x-full" x-transition:enter-end="translate-x-0" x-transition:leave="transition ease-in duration-150" x-transition:leave-start="translate-x-0" x-transition:leave-end="-translate-x-full" class="fixed inset-y-0 left-0 z-50 lg:hidden" style="display:none;" data-include="../components/sidebar.html"></div>

    <div class="flex flex-1 flex-col overflow-hidden">
      <div data-include="../components/navbar.html"></div>

      <main class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8" x-data="masterLookupPage()" x-init="init()">
        <div class="mx-auto max-w-5xl space-y-6">
          <div>
            <h1 class="text-xl font-semibold text-slate-900">Master Data — Kategori / Satuan / Merk</h1>
            <p class="mt-1 text-sm text-slate-500">Data referensi sederhana yang dipakai form Obat.</p>
          </div>

          <!-- Tabs -->
          <div class="flex gap-1 border-b border-slate-200">
            <template x-for="tab in tabs" :key="tab.key">
              <button
                type="button"
                class="border-b-2 px-4 py-2 text-sm font-medium"
                :class="activeTab === tab.key ? 'border-primary-600 text-primary-600' : 'border-transparent text-slate-500 hover:text-slate-700'"
                @click="setTab(tab.key)"
                x-text="tab.label"
              ></button>
            </template>
          </div>

          <!-- Tab: Kategori -->
          <div x-show="activeTab === 'category'" x-data="pages.category">
            <div data-include="../components/crud-table.html"></div>

            <div x-show="showModal" x-transition.opacity class="modal-backdrop" style="display: none;" @keydown.escape.window="closeModal()">
              <div class="modal-panel max-w-sm" @click.outside="closeModal()">
                <h3 class="text-base font-semibold text-slate-900" x-text="isEdit ? 'Edit Kategori' : 'Tambah Kategori'"></h3>
                <div x-show="formError" x-transition class="mt-3 rounded-lg bg-danger-50 px-3 py-2 text-sm text-danger-700" x-text="formError" style="display:none;"></div>
                <form @submit.prevent="submitForm()" class="mt-4 space-y-3">
                  <div>
                    <label class="input-label">Nama Kategori <span class="text-danger-600">*</span></label>
                    <input type="text" class="input-field" x-model="form.name" placeholder="Contoh: Analgesik" required />
                  </div>
                  <div>
                    <label class="input-label">Status</label>
                    <select class="input-field" x-model="form.status"><option value="active">Aktif</option><option value="inactive">Nonaktif</option></select>
                  </div>
                  <div class="mt-5 flex justify-end gap-2">
                    <button type="button" class="btn btn-ghost" @click="closeModal()">Batal</button>
                    <button type="submit" class="btn btn-primary" :disabled="saving"><span x-show="!saving">Simpan</span><span x-show="saving">Menyimpan...</span></button>
                  </div>
                </form>
              </div>
            </div>
          </div>

          <!-- Tab: Satuan -->
          <div x-show="activeTab === 'unit'" x-data="pages.unit">
            <div data-include="../components/crud-table.html"></div>

            <div x-show="showModal" x-transition.opacity class="modal-backdrop" style="display: none;" @keydown.escape.window="closeModal()">
              <div class="modal-panel max-w-sm" @click.outside="closeModal()">
                <h3 class="text-base font-semibold text-slate-900" x-text="isEdit ? 'Edit Satuan' : 'Tambah Satuan'"></h3>
                <div x-show="formError" x-transition class="mt-3 rounded-lg bg-danger-50 px-3 py-2 text-sm text-danger-700" x-text="formError" style="display:none;"></div>
                <form @submit.prevent="submitForm()" class="mt-4 space-y-3">
                  <div>
                    <label class="input-label">Nama Satuan <span class="text-danger-600">*</span></label>
                    <input type="text" class="input-field" x-model="form.name" placeholder="Contoh: Strip, Botol, Box" required />
                  </div>
                  <div>
                    <label class="input-label">Status</label>
                    <select class="input-field" x-model="form.status"><option value="active">Aktif</option><option value="inactive">Nonaktif</option></select>
                  </div>
                  <div class="mt-5 flex justify-end gap-2">
                    <button type="button" class="btn btn-ghost" @click="closeModal()">Batal</button>
                    <button type="submit" class="btn btn-primary" :disabled="saving"><span x-show="!saving">Simpan</span><span x-show="saving">Menyimpan...</span></button>
                  </div>
                </form>
              </div>
            </div>
          </div>

          <!-- Tab: Merk -->
          <div x-show="activeTab === 'brand'" x-data="pages.brand">
            <div data-include="../components/crud-table.html"></div>

            <div x-show="showModal" x-transition.opacity class="modal-backdrop" style="display: none;" @keydown.escape.window="closeModal()">
              <div class="modal-panel max-w-sm" @click.outside="closeModal()">
                <h3 class="text-base font-semibold text-slate-900" x-text="isEdit ? 'Edit Merk' : 'Tambah Merk'"></h3>
                <div x-show="formError" x-transition class="mt-3 rounded-lg bg-danger-50 px-3 py-2 text-sm text-danger-700" x-text="formError" style="display:none;"></div>
                <form @submit.prevent="submitForm()" class="mt-4 space-y-3">
                  <div>
                    <label class="input-label">Nama Merk <span class="text-danger-600">*</span></label>
                    <input type="text" class="input-field" x-model="form.name" placeholder="Contoh: Kimia Farma" required />
                  </div>
                  <div>
                    <label class="input-label">Status</label>
                    <select class="input-field" x-model="form.status"><option value="active">Aktif</option><option value="inactive">Nonaktif</option></select>
                  </div>
                  <div class="mt-5 flex justify-end gap-2">
                    <button type="button" class="btn btn-ghost" @click="closeModal()">Batal</button>
                    <button type="submit" class="btn btn-primary" :disabled="saving"><span x-show="!saving">Simpan</span><span x-show="saving">Menyimpan...</span></button>
                  </div>
                </form>
              </div>
            </div>
          </div>

        </div>
      </main>
    </div>
  </div>

  <div data-include="../components/toast.html"></div>
  <div data-include="../components/modal.html"></div>
</body>
</html>
