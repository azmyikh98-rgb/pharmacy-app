<!--
  loading.html
  -----------------------------------------------------------------------
  Kumpulan pola skeleton loading. Ini bukan komponen tunggal yang di-include
  utuh, melainkan REFERENSI class siap pakai (didefinisikan di css/style.css):

    .skeleton-line   -> baris teks/skeleton sel tabel (dipakai di table.html)
    .skeleton-block  -> blok persegi (untuk card/summary saat loading)
    .skeleton-circle -> avatar/icon bulat saat loading

  Contoh pemakaian di bawah ini ditampilkan sebagai preview visual di
  halaman Design System (index.html).
-->
<div class="app-card space-y-4 p-5">
  <div class="flex items-center gap-3">
    <div class="skeleton-circle"></div>
    <div class="flex-1 space-y-2">
      <div class="skeleton-line w-1/3"></div>
      <div class="skeleton-line w-1/2"></div>
    </div>
  </div>
  <div class="skeleton-block h-24 w-full"></div>
  <div class="space-y-2">
    <div class="skeleton-line"></div>
    <div class="skeleton-line w-5/6"></div>
    <div class="skeleton-line w-2/3"></div>
  </div>
</div>
